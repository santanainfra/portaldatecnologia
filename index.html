    const STORAGE_KEY = 'portal_tecnologia_state_v1';

    let appState = {

    function loadState() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          const parsed = JSON.parse(saved);
          appState = { ...appState, ...parsed };
        }
      } catch (e) {
        console.warn('Não foi possível ler o localStorage:', e);
      }
    }

    function saveState(showFeedback = false) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          completedTopics: appState.completedTopics,
          quizScores: appState.quizScores
        }));
        updateProgressUI();
        if (showFeedback) showToast('Progresso salvo no navegador!');
      } catch (e) {
        console.warn('Erro ao salvar estado:', e);
      }
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toast-msg');
      toastMsg.textContent = msg;
      toast.classList.remove('hidden');
      toast.classList.add('flex');
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => {
        toast.classList.add('hidden');
        toast.classList.remove('flex');
      }, 2600);
    }

    function toggleTopicCompletion(topicId) {
      const idx = appState.completedTopics.indexOf(topicId);
      if (idx > -1) {
        appState.completedTopics.splice(idx, 1);
        saveState(true);
      } else {
        appState.completedTopics.push(topicId);
        saveState(true);
      }
      const topic = SYLLABUS.find(t => t.id === topicId);
      if (topic) renderTopicView(topic);
    }

    function answerQuiz(topicId, qIdx, selectedIdx) {
      const topic = SYLLABUS.find(t => t.id === topicId);
      const qItem = topic.quiz[qIdx];
      const feedbackEl = document.getElementById(`quiz-feedback-${qIdx}`);
      const isCorrect = selectedIdx === qItem.answer;

      // Highlight options
      qItem.options.forEach((_, i) => {
        const btn = document.getElementById(`quiz-opt-${qIdx}-${i}`);
        btn.classList.remove('border-emerald-500', 'bg-emerald-500/15', 'border-rose-500', 'bg-rose-500/15');
        if (i === qItem.answer) {
          btn.classList.add('border-emerald-500', 'bg-emerald-500/15', 'text-emerald-200');
        } else if (i === selectedIdx && !isCorrect) {
          btn.classList.add('border-rose-500', 'bg-rose-500/15', 'text-rose-200');
        }
      });

      feedbackEl.classList.remove('hidden', 'bg-emerald-500/10', 'border-emerald-500/30', 'text-emerald-200', 'bg-rose-500/10', 'border-rose-500/30', 'text-rose-200');
      if (isCorrect) {
        feedbackEl.classList.add('bg-emerald-500/10', 'border', 'border-emerald-500/30', 'text-emerald-200');
        feedbackEl.innerHTML = `<strong>✓ Resposta Correta!</strong> ${qItem.explanation}`;
        if (!appState.completedTopics.includes(topicId)) {
          appState.completedTopics.push(topicId);
          saveState(true);
          renderSidebar();
        }
      } else {
        feedbackEl.classList.add('bg-rose-500/10', 'border', 'border-rose-500/30', 'text-rose-200');
        feedbackEl.innerHTML = `<strong>✕ Quase lá!</strong> ${qItem.explanation}`;
      }
    }

    async function computeSHA256Lab(text) {
      const out = document.getElementById('sha256-output');
      if (!out) return;
      try {
        const encoder = new TextEncoder();
        const data = encoder.encode(text);
        const hashBuffer = await crypto.subtle.digest('SHA-256', data);
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        out.textContent = hashHex;
      } catch (e) {
        out.textContent = 'SHA-256 indisponível neste contexto.';
      }
    }

    function executeResetProgress() {
      appState.completedTopics = [];
      appState.quizScores = {};
      saveState(false);
      closeModal();
      showToast('Progresso reiniciado.');
      if (appState.activeView === 'home') {
        renderDashboard();
      } else {
        const topic = SYLLABUS.find(t => t.id === appState.activeView);
        if (topic) renderTopicView(topic);
      }
    }

    function closeModal() {
      const modal = document.getElementById('custom-modal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }
